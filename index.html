<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dune! Clone – Natural Lift-Off at Inflection Points</title>
  <style>
    body { margin:0; overflow:hidden; background:#0070c8; }
    canvas { display:block; background:#0070c8; }
    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: sans-serif;
      font-size: 24px;
      color: white;
      user-select: none;
    }
  </style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  const scale = 0.5;

  const segmentWidth = 5;
  const waveAmplitude = 120;
  const waveFrequency = 0.004;

  const gravity = 0.5;
  const acceleration = 0.15;

  const ballRadius = 36;
  let scrollOffset = 0;

  const terrain = [];
  const coins = [];
  const obstacles = [];

  const keys = { space: false };

  let score = 0;
  let timeAlive = 0;
  let gameOver = false;

  const ballImage = new Image();
  ballImage.src = "tennis-ball-transparent-free-png.png";

  const ball = {
    x: 200,
    y: H / scale - 600,
    vx: 0,
    vy: 0,
    grounded: false,
  };

  function dist(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
  }

  function generateTerrain(startX, count) {
    for (let i = 0; i < count; i++) {
      const x = startX + i * segmentWidth;
      let y;
      if (x < 600) {
        y = H / scale - 200;
      } else {
        y = H / scale - 200 + Math.sin(x * waveFrequency) * waveAmplitude;
      }
      terrain.push({ x, y });

      if (Math.random() < 0.015) {
        coins.push({
          x,
          y: y - 200 - Math.random() * 600,
          collected: false,
        });
      }

      if (Math.random() < 0.005) {
        obstacles.push({
          x,
          y: y - 300 - Math.random() * 700,
          size: 30,
        });
      }
    }
  }

  function getTerrainY(x) {
    for (let i = 0; i < terrain.length - 1; i++) {
      const p1 = terrain[i];
      const p2 = terrain[i + 1];
      if (x >= p1.x && x <= p2.x) {
        const ratio = (x - p1.x) / (p2.x - p1.x);
        return p1.y * (1 - ratio) + p2.y * ratio;
      }
    }
    return H / scale;
  }

  // Approximate first and second derivatives of terrain at x
  function terrainDerivatives(x) {
    const h = 1;
    const y0 = getTerrainY(x);
    const y1 = getTerrainY(x + h);
    const y_1 = getTerrainY(x - h);

    const firstDeriv = (y1 - y_1) / (2 * h);
    const secondDeriv = (y1 - 2 * y0 + y_1) / (h * h);

    return { firstDeriv, secondDeriv };
  }

  function endGame(reason) {
    if (gameOver) return;
    gameOver = true;
    setTimeout(() => {
      if (confirm(`${reason}\nYour Score: ${score}\nPlay again?`)) {
        location.reload();
      }
    }, 200);
  }

  let lastTime = performance.now();

  function update(dt) {
    if (gameOver) return;

    timeAlive += dt;
    score = Math.floor(timeAlive) + coins.filter(c => c.collected).length * 5;
    document.getElementById("score").innerText = "Score: " + score;

    // Gravity always applies
    ball.vy += gravity;

    // Horizontal acceleration when grounded and holding space
    if (ball.grounded && keys.space) {
      ball.vx += acceleration;
    } else if (ball.grounded) {
      ball.vx *= 0.98;
      if (Math.abs(ball.vx) < 0.01) ball.vx = 0;
    } else {
      // Airborne: less horizontal friction to preserve momentum
      ball.vx *= 0.995;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Terrain collision & grounding logic with curvature check
    const terrainY = getTerrainY(ball.x);
    const ballBottom = ball.y + ballRadius;

    const { firstDeriv: slope, secondDeriv: curvature } = terrainDerivatives(ball.x);
    const epsilon = 3;

    if (ballBottom >= terrainY - epsilon) {
      if (ball.vy > 0) {
        // Falling down: stick firmly
        ball.y = terrainY - ballRadius;
        ball.vy = 0;
        ball.grounded = true;
      } else {
        // Moving up or stable — check curvature
        if (curvature <= 0) {
          // Ground curves downward or flat - stick to ground
          ball.y = terrainY - ballRadius;
          ball.grounded = true;
          ball.vy *= 0.5; // gentle ground push
        } else {
          // Ground curves upward - ball lifts off naturally
          ball.grounded = false;
        }
      }
    } else {
      // In air
      ball.grounded = false;
    }

    // Crash detection on steep uphill when grounded
    if (ball.grounded) {
      const deltaSlopeCheck = 0.1;
      const yAhead = getTerrainY(ball.x + deltaSlopeCheck);
      const slopeCheck = (yAhead - terrainY) / deltaSlopeCheck;

      const terrainAngle = Math.atan(slopeCheck);
      const ballAngle = Math.atan2(ball.vy, ball.vx);
      const impactAngle = Math.abs(terrainAngle - ballAngle);

      const IMPACT_ANGLE_THRESHOLD = 1.22;
      const MIN_HORIZ_SPEED = 2;

      if (slopeCheck > 0 && impactAngle > IMPACT_ANGLE_THRESHOLD && Math.abs(ball.vx) > MIN_HORIZ_SPEED) {
        endGame("Crashed into uphill slope!");
      }
    }

    // Coin collection
    for (const coin of coins) {
      if (!coin.collected && dist(ball.x, ball.y, coin.x, coin.y) < ballRadius + 10) {
        coin.collected = true;
      }
    }

    // Obstacle collisions
    for (const obs of obstacles) {
      if (dist(ball.x, ball.y, obs.x, obs.y) < ballRadius + obs.size) {
        endGame("Hit an obstacle!");
      }
    }

    // Fell off check
    if (ball.y > H / scale + 300) {
      endGame("You fell off!");
    }

    // Generate more terrain as needed
    const lastX = terrain[terrain.length - 1].x;
    if (ball.x + W / scale > lastX) {
      generateTerrain(lastX, 500);
    }

    scrollOffset = ball.x - 200;
  }

  function drawTerrain() {
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.moveTo(terrain[0].x - scrollOffset, terrain[0].y);
    for (let i = 1; i < terrain.length; i++) {
      ctx.lineTo(terrain[i].x - scrollOffset, terrain[i].y);
    }
    ctx.lineTo(terrain[terrain.length - 1].x - scrollOffset, H / scale);
    ctx.lineTo(terrain[0].x - scrollOffset, H / scale);
    ctx.closePath();
    ctx.fill();
  }

  function drawBall() {
    ctx.drawImage(ballImage, ball.x - ballRadius - scrollOffset, ball.y - ballRadius, ballRadius * 2, ballRadius * 2);
  }

  function drawCoins() {
    ctx.fillStyle = "gold";
    for (const coin of coins) {
      if (!coin.collected) {
        ctx.beginPath();
        ctx.arc(coin.x - scrollOffset, coin.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "yellow";
        ctx.stroke();
      }
    }
  }

  function drawObstacles() {
    ctx.fillStyle = "red";
    for (const obs of obstacles) {
      ctx.beginPath();
      ctx.arc(obs.x - scrollOffset, obs.y, obs.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.scale(scale, scale);

    update(dt);

    drawTerrain();
    drawCoins();
    drawObstacles();
    drawBall();

    if (!gameOver) {
      requestAnimationFrame(loop);
    }
  }

  window.addEventListener("keydown", e => {
    if (e.code === "Space") keys.space = true;
  });
  window.addEventListener("keyup", e => {
    if (e.code === "Space") keys.space = false;
  });

  window.addEventListener("resize", () => {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  });

  generateTerrain(0, 1000);
  ballImage.onload = () => {
    requestAnimationFrame(loop);
  };
})();
</script>
</body>
</html>
